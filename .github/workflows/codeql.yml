name: "CodeQL Security Scan"

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  analyze:
    name: Analyze Java
    runs-on: ubuntu-latest

    permissions:
      security-events: write
      packages: read
      contents: read

    steps:

      # 1. Download repository source code
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup java # Install Java on the runner
        uses: actions/setup-java@v4
        with:
          distribution: 'adopt'
          # The distribution of Java to install. In this case, it specifies the AdoptOpenJDK distribution.
          # See https://github.com/actions/setup-java?tab=readme-ov-file#supported-distributions for supported distributions.
          java-version: '21'  # The version of Java to install in the job runner.

      # 3. Initialize CodeQL BEFORE compiling
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: java-kotlin
          #build-mode: manual

      # 4. Compile Java while CodeQL observes the build
      - name: Build project
        run: mvn clean compile

      # 5. Run CodeQL queries and upload results
      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4